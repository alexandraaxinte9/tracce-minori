frasi:
  - orario: 8:37
    frase: Stamattina l’aria sa de pioggia… però ‘na passeggiata fino ar centro ce sta tutta

  - orario: 9:58
    frase: Oh guarda quello come corre… ma ‘ndo deve annà tutta ‘sta gente la mattina?

  - orario: 10:10
    frase: Me fermo du’ minuti qua… tanto c’ho tempo, mica me corre dietro nessuno.

  - orario: 11:03
    frase: Sto sole spacca oggi… quasi quasi me metto all’ombra e me bevo qualcosa.

  - orario: 11:35
    frase: Ogni giorno stessa strada, stesse facce… però quarcosa cambia sempre.

  - orario: 12:47
    frase: Aspetta che guardo l’orologio… ahò già mezzogiorno? Er tempo vola senza manco accorgersene.
