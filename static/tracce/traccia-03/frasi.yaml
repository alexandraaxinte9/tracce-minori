frasi:
  - orario: 8:39
    frase: Adè vado a fa’ ‘n giru… magari trovo quarcunu con cui fa’ du’ chiacchiere. Intantu me guardo un po’ attornu.

  - orario: 9:59
    frase: Annamo a pijà ‘n caffè va… stamattina so’ un po’ rintronato. Dopo faccio pure ‘n giru ar mercatu.

  - orario: 10:15
    frase: Quasi quasi entro a dà ‘n’occhiata… ma va là, ce torno più tardi. Me fo ancora ‘na camminata.

  - orario: 11:06
    frase: Torno alla panchina… oggi in giro ce sta poca gente. Aspetta che controllo er telefono, magari m’ha scritto qualcuno.

  - orario: 11:39
    frase: Adè è ora de magnà, annamo da Baldo. Oggi me pijjo ‘n bellu primu e pure ‘n contornu. Er dolce magari più tardi, co’ ‘n caffettinu.

  - orario: 12:47
    frase:Se faccio tardi poi me s’arvorta tutta la giornata. Prima de tornà a casa faccio ancora ‘n giru.
