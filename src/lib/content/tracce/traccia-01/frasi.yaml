titolo: "Traccia 01"
frasi:
  - orario: 8:32
    frase: Adesso vado a prendere il giornale! Questo me lo tengo che ce scrivo.

  - orario: 9:55
    frase: Mo’ annamo a fa’ du’ giocate.Famo sti numeri e poi annamo avanti.

  - orario: 10:05
    frase: Quasi quasi entro… No, lascia perde, oggi no…..Vabbè, faccio n’altra girata.

  - orario: 11:00
    frase: Torna alla panchina….Non vedo nessuno guardamo il telefono se qualcuno mi ha mandato un sms.

  - orario: 11:33
    frase: Mo’ è ora de magnà, annamo da Baldo. 15 euro spenderò I numeri me gireno sempre. Prendo 1 primo, un contorno il dolce lo prendo dopo va dalla tabaccheria un bel bounty.

  - orario: 12:45
    frase: Se faccio tardi, poi salta tutto. Prima de annà a casa, passo in tabaccheria.
